<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground - Topologic Games</title>
  <meta property="og:site_name" content="Topologic Games">
  <meta property="og:title" content="Topologic Games - Playground">
  <meta property="og:description" content="Watch or play chess and Go on quotient surfaces.">
  <meta property="og:image" content="https://games.kh3dron.net/og.png">
  <meta property="og:url" content="https://games.kh3dron.net/play.html">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="description" content="Watch or play chess and Go on quotient surfaces.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">
    <nav id="sidebar">
      <a id="catalog-link" href="./index.html">&larr; Catalog</a>
      <h1 id="game-title">Chess</h1>
      <label id="slide-control" class="checkbox-control">
        <input type="checkbox" id="slide-board">
        <span>Animate</span>
      </label>
      <label id="boundary-control" class="checkbox-control">
        <input type="checkbox" id="show-boundaries">
        <span>Boundaries</span>
      </label>
      <label id="surface-control" class="checkbox-control">
        <input type="checkbox" id="show-surface">
        <span>3D view</span>
      </label>
      <div id="size-control">
        <span class="size-label">Board</span>
        <button class="size-btn" data-size="9">9</button>
        <button class="size-btn" data-size="13">13</button>
        <button class="size-btn" data-size="19">19</button>
      </div>
      <button id="pass-btn" class="action-btn">Pass</button>
      <button id="undo-btn" class="action-btn" disabled>Undo</button>
      <a id="about-link" href="./about.html">About</a>
      <button id="reset">New game</button>
    </nav>
    <main id="game-area">
      <div id="top-bar">
        <div id="status" role="status">White's turn</div>
        <div id="score-hud" hidden></div>
        <div id="drag-hint">drag to pan</div>
        <div id="zoom-controls">
          <button id="zoom-out" title="Zoom out" aria-label="Zoom out">-</button>
          <button id="zoom-level" title="Reset zoom" aria-label="Reset zoom">100%</button>
          <button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div id="board-container" tabindex="0"
        aria-label="Game board. Arrow keys move the cursor, Enter or Space selects, Escape hides the cursor.">
        <div id="board"></div>
      </div>
      <section id="surface-dock" class="surface-dock" hidden>
        <header class="surface-dock-head">
          <span class="surface-dock-title">3D</span>
          <span id="surface-name" class="surface-dock-name"></span>
          <button id="surface-close" class="surface-dock-btn" aria-label="Hide 3D view" title="Hide">&times;</button>
        </header>
        <canvas id="surface-live" aria-label="Current position in 3D. Drag to rotate, click a cell to play it."></canvas>
        <div id="surface-views" class="segmented surface-views" role="group" aria-label="3D view">
          <button class="seg-btn" data-view="board">Board</button>
          <button class="seg-btn" data-view="tiling">Tiling</button>
          <button class="seg-btn active" data-view="surface">Surface</button>
        </div>
      </section>
    </main>
    <aside id="info-panel">
      <details class="panel-section">
        <summary class="panel-label">1 Site</summary>
        <div id="site-blurb">Chess and Go on quotients of the plane. Each topology changes only the edge behavior (wrap, reflect, rotate, or wall); rules and starting positions are fixed. <a href="./about.html">Read the math</a>.</div>
      </details>
      <details class="panel-section" open>
        <summary class="panel-label">2 Rules</summary>
        <div id="mode-description"></div>
      </details>
      <details class="panel-section">
        <summary class="panel-label">3 Notes</summary>
        <div id="mode-article"></div>
      </details>
      <details class="panel-section">
        <summary class="panel-label">4 References</summary>
        <div id="mode-links"></div>
      </details>
      <details class="panel-section">
        <summary class="panel-label">5 Edge spec</summary>
        <div id="mode-spec"></div>
      </details>
      <details class="panel-section">
        <summary class="panel-label">6 Legend</summary>
        <div id="seam-legend"></div>
      </details>
    </aside>
  </div>
  <script type="module" src="/src/play.ts"></script>
</body>

</html>
