# Cuts a semantic release (tag + GitHub Release) from conventional commits,
# then builds the Vite app and deploys it to GitHub Pages by pushing dist/ to
# the gh-pages branch (Pages source = gh-pages, switched from artifact deploys
# so PR previews can live in pr-preview/ subfolders - see pr-preview.yml).
name: Release and deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  build-and-deploy:
    needs: release
    # Deploy even if `release` fails: semantic-release depends on the GitHub API
    # (verifyConditions), which can return transient 5xx/HTML errors unrelated to
    # the app. A flaky release step must not block Pages deploys. Release failures
    # stay visible (red job) but non-blocking.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Add CNAME for the custom domain
        run: echo 'games.kh3dron.net' > dist/CNAME

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          # PR previews (pr-preview.yml) live under pr-preview/ on the same
          # branch; production deploys must not sweep them away.
          clean-exclude: |
            pr-preview/
          force: false
